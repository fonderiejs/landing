<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="630" fill="#fafaf8"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e4e3df"/>
  <!-- molten glow bottom-right -->
  <defs>
    <radialGradient id="glow" cx="82%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#e8791a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8791a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo: 3x3 dot cluster + wordmark -->
  <g transform="translate(80,84)" fill="#1c1b19">
    <circle cx="6"  cy="6"  r="5"/><circle cx="24" cy="6"  r="5" fill-opacity="0.85"/><circle cx="42" cy="6"  r="5" fill-opacity="0.6"/>
    <circle cx="6"  cy="24" r="5" fill-opacity="0.7"/><circle cx="24" cy="24" r="5" fill-opacity="0.45"/><circle cx="42" cy="24" r="5" fill-opacity="0.2"/>
    <circle cx="6"  cy="42" r="5" fill-opacity="0.4"/><circle cx="24" cy="42" r="5" fill-opacity="0.2"/><circle cx="42" cy="42" r="5" fill-opacity="0.2"/>
    <text x="66" y="34" font-size="30" font-weight="700" letter-spacing="-0.5">Fonderie</text>
  </g>

  <!-- eyebrow (mono) -->
  <text x="80" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#6b6a65">Open source · npm install @fonderie/core</text>

  <!-- headline -->
  <text x="78" y="372" font-size="86" font-weight="700" letter-spacing="-3" fill="#1c1b19">Build SaaS with AI,</text>
  <text x="78" y="466" font-size="86" font-weight="700" letter-spacing="-3" fill="#1c1b19">not boilerplate.</text>

  <!-- subline -->
  <text x="80" y="536" font-size="27" fill="#54534e">The backend suite for AI-built SaaS.</text>
</svg>
