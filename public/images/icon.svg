<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fonderie">
  <!-- Fonderie mark on tile: a 3x3 dot matrix, F cast in warm white, empty moulds in deep orange.
       Grid: pitch 16, dot r 6.5, centres at 16 / 32 / 48 on both axes.
       Rows: 111 / 110 / 100. Pitch = 4px at 16px, centres on whole pixels. -->
  <defs>
    <linearGradient id="fonderie-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f65501"/>
      <stop offset="1" stop-color="#e04d00"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fonderie-tile)"/>
  <g fill="#b83d00">
    <circle cx="48" cy="32" r="6.5"/>
    <circle cx="32" cy="48" r="6.5"/>
    <circle cx="48" cy="48" r="6.5"/>
  </g>
  <g fill="#fffdf5">
    <circle cx="16" cy="16" r="6.5"/>
    <circle cx="32" cy="16" r="6.5"/>
    <circle cx="48" cy="16" r="6.5"/>
    <circle cx="16" cy="32" r="6.5"/>
    <circle cx="32" cy="32" r="6.5"/>
    <circle cx="16" cy="48" r="6.5"/>
  </g>
</svg>
